# --- Image placement ------------------------------------------------------
# The bootloader lives at the start of flash and must fit inside the region
# reserved for it. Keep CONFIG_FLASH_LOAD_SIZE in sync with
# ALONZO_BOOTLOADER_SIZE (enforced by a BUILD_ASSERT in memory_layout.h).
CONFIG_FLASH_LOAD_OFFSET=0
CONFIG_FLASH_LOAD_SIZE=0x20000

# --- Console --------------------------------------------------------------
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# --- Flash driver (self-programming of the application region) ------------
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y

# --- Micro-SD (TF) over SPI + FAT filesystem ------------------------------
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y

# --- Minimal bootloader: no MPU / HW stack guard --------------------------
# The application re-enables these. Bootloader MPU regions would otherwise
# block the raw handoff to the application image.
CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n

# --- Sizing for FAT FS + SD + flash buffers -------------------------------
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=8192
